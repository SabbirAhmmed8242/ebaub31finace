<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Error</title>

    <meta http-equiv="refresh" content="2;url={% url 'Login' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f8fc;
            font-family: Arial, sans-serif;
        }

        .error-card {
            background: white;
            padding: 40px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 90%;
        }

        .error-icon {
            font-size: 55px;
            color: #e31b23;
        }

        h2 {
            color: #e31b23;
            font-weight: bold;
            margin: 15px 0;
        }

        p {
            color: #667085;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="error-icon">✖</div>

        <h2>Login Failed!</h2>

        <p>Incorrect password. Please try again.</p>

        <p>Redirecting to login page in 2 seconds...</p>

        <a href="{% url 'Login' %}" class="btn btn-success mt-2">
            Back to Login
        </a>
        <a href="{% url 'Home' %}" class="btn btn-success mt-2">
            Back to Home
        </a>
    </div>
</body>
</html>
