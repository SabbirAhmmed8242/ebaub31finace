<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Registration | 31st Banking System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 100px 25px 25px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00843d, #004d2d);
            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* Main Card */

        .register-wrapper {

            width: 100%;
            max-width: 1050px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */

        .register-info {
            height: 100%;
            min-height: 650px;
            padding: 55px 45px;
            background:
                linear-gradient(
                    145deg,
                    #00843d,
                    #005a35
                );
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        .bank-logo {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            background: white;
            color: #00843d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 25px;
        }


        .bank-name {
            font-size: 45px;
            font-weight: 800;
            letter-spacing: 2px;
        }


        .bank-name .red {
            color: #ff4d4d;
        }


        .bank-name .green {
            color: #9bf2bd;
        }


        .university-name {
            font-size: 20px;
            color: #e5fff0;
            margin-top: 12px;
            line-height: 1.5;
        }


        .info-text {
            color: #c9f5da;
            line-height: 1.8;
            margin-top: 20px;
        }


        .batch {
            display: inline-block;
            width: fit-content;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
        }


        /* Form Area */

        .register-form-area {
            min-height: 650px;
            padding: 50px;
            display: flex;
            align-items: center;
        }


        .register-form {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }


        .register-form h2 {

            font-weight: 800;
            color: #101828;
            margin-bottom: 8px;

        }


        .subtitle {

            color: #667085;
            margin-bottom: 28px;

        }


        /* Form */

        .form-label {

            font-weight: 600;

            color: #344054;

        }


        .input-group {

            margin-bottom: 18px;

        }


        .input-group-text {

            background: #f8fafc;

            color: #00843d;

            border-right: none;

            border-color: #d0d5dd;

        }


        .form-control,
        .form-select {

            height: 48px;

            border-color: #d0d5dd;

        }


        .form-control:focus,
        .form-select:focus {

            border-color: #00843d;

            box-shadow:
                0 0 0 3px rgba(0,132,61,0.08);

        }


        /* Register Button */

        .register-btn {

            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background: #00843d;

            color: white;

            font-size: 17px;

            font-weight: 700;

            transition: 0.3s;

        }


        .register-btn:hover {

            background: #006b32;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0,132,61,0.25);

        }


        /* Login */

        .login-text {

            text-align: center;

            margin-top: 22px;

            color: #667085;

        }


        .login-link {

            color: #00843d;

            font-weight: 700;

            text-decoration: none;

        }


        .login-link:hover {

            text-decoration: underline;

        }


        /* Mobile */

        @media (max-width: 767px) {

            .register-info {

                min-height: auto;

                padding: 40px 30px;

                text-align: center;

            }


            .bank-logo {

                margin-left: auto;

                margin-right: auto;

            }


            .bank-name {

                font-size: 38px;

            }


            .batch {

                margin-left: auto;

                margin-right: auto;

            }


            .register-form-area {

                min-height: auto;

                padding: 40px 25px;

            }

        }

    </style>

</head>


<body>

    
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark"
        style="background: #004d2d; position: absolute; top: 0; left: 0; width: 100%; z-index: 1000;">

        <div class="container-fluid px-4">

            <!-- Brand -->
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-bank2 me-2"></i>
                EXIM BANK
            </a>

            <!-- Mobile Toggle -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'Home' %}">
                            <i class="bi bi-house-door me-1"></i>
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="#contact">
                            <i class="bi bi-telephone me-1"></i>
                            Contact
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-light fw-bold px-4"
                        style="color: #00843d; border-radius: 8px;"
                        href="{% url 'Login' %}">
                            <i class="bi bi-box-arrow-in-right me-1"></i>
                            Login
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <div class="register-wrapper">

        <div class="row g-0">


            <!-- ================= LEFT SIDE ================= -->

            <div class="col-md-5">

                <div class="register-info">


                    <div class="bank-logo">

                        <i class="bi bi-bank2"></i>

                    </div>


                    <div class="bank-name">

                        <span class="red">E</span><span class="green">XIM</span>

                    </div>


                    <div class="university-name">

                        Bank Agricultural University Bangladesh

                    </div>


                    <p class="info-text">

                        Create your student banking account
                        and become part of the 31st Batch
                        Banking System.

                    </p>


                    <div class="batch">

                        <i class="bi bi-mortarboard-fill me-2"></i>

                        31<sup>st</sup> Batch

                    </div>

                </div>

            </div>



            <!-- ================= REGISTRATION FORM ================= -->

            <div class="col-md-7">

                <div class="register-form-area">


                    <form
                        class="register-form"
                        action=""
                        method="POST">
                        {% csrf_token %}
                        <h2>
                            Create Account
                        </h2>


                        <p class="subtitle">
                            Register for the 31st Batch Banking System
                        </p>

                        <!-- Name -->
                        <label class="form-label">
                            Full Name
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">

                                <i class="bi bi-person"></i>

                            </span>
                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter your full name"
                                name="Name"
                                required>
                        </div>

                        <!-- Username -->
                        <label class="form-label">
                            Username
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-badge"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter your username"
                                name="UserName"
                                required>
                        </div>

                        <!-- Batch -->
                        <label class="form-label">
                            Batch
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-mortarboard"></i>
                            </span>

                            <select
                                class="form-select"
                                name="Batch"
                                required>
                                <option value="" selected disabled>
                                    Select Your Batch
                                </option>

                                <option value="31">
                                    31<sup>st</sup> Batch
                                </option>
                            </select>
                        </div>



                        
                        <!-- Registration Number -->

                        <label class="form-label">
                            Registration Number
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-card-text"></i>
                            </span>

                            <select
                                class="form-select"
                                name="Registration"
                                required>
                                <option value="" selected disabled>
                                    Select your registration number
                                </option>
                                <option value="0602610001141001">0602610001141001</option>
                                <option value="0602610001141002">0602610001141002</option>
                                <option value="0602610001141003">0602610001141003</option>
                                <option value="0602610001141004">0602610001141004</option>
                                <option value="0602610001141005">0602610001141005</option>
                                <option value="0602610001141006">0602610001141006</option>
                                <option value="0602610001141008">0602610001141008</option>
                                <option value="0602610001141009">0602610001141009</option>
                                <option value="0602610001141012">0602610001141012</option>
                                <option value="0602610001141013">0602610001141013</option>
                                <option value="0602610001141014">0602610001141014</option>
                                <option value="0602610001141015">0602610001141015</option>
                                <option value="0602610001141016">0602610001141016</option>
                                <option value="0602610001141017">0602610001141017</option>
                                <option value="0602610001141018">0602610001141018</option>
                                <option value="0602510001141029">0602510001141029</option>
                            </select>
                        </div>

                        
                        <label class="form-label">
                            Mobile Number
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-phone"></i>
                            </span>

                            <input
                                type="tel"
                                class="form-control"
                                placeholder="Enter your mobile number"
                                name="Mobile"
                                required>
                        </div>

                        <!-- Password -->

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">

                                <i class="bi bi-lock"></i>

                            </span>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Create a password"
                                name="Password"
                                id="password"
                                required>
                            <button
                                type="button"
                                class="input-group-text"
                                onclick="togglePassword()">
                                <i
                                    class="bi bi-eye"
                                    id="eyeIcon">
                                </i>
                            </button>

                        </div>
                        <!-- Submit -->
                        <button
                            type="submit"
                            class="register-btn">
                            <i class="bi bi-person-plus-fill me-2"></i>
                            Create Account
                        </button>



                        <!-- Login -->

                        <div class="login-text">

                            Already have an account?

                            <a
                                href="{%url 'Login'%}"
                                class="login-link">

                                Login

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eyeIcon =
                document.getElementById("eyeIcon");


            if (password.type === "password") {

                password.type = "text";

                eyeIcon.classList.remove("bi-eye");

                eyeIcon.classList.add("bi-eye-slash");

            }

            else {

                password.type = "password";

                eyeIcon.classList.remove("bi-eye-slash");

                eyeIcon.classList.add("bi-eye");

            }

        }

    </script>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
