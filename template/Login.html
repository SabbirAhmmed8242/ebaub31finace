<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Student Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e0eaff, #f5eaff, #e6f7ff);
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(90deg, #172554, #4338ca);
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar-brand i {
            margin-right: 8px;
        }

        .nav-link {
            color: #ffffff !important;
            margin-left: 12px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #c7d2fe !important;
            transform: translateY(-2px);
        }

        .register-nav {
            background: #ffffff;
            color: #3730a3 !important;
            border-radius: 8px;
            padding: 8px 16px !important;
        }

        .register-nav:hover {
            background: #e0e7ff;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 15px 45px rgba(30, 41, 100, 0.15);
            animation: fadeIn 0.7s ease;
        }

        .login-header {
            text-align: center;
            padding: 30px 20px;
            color: white;
            background: linear-gradient(135deg, #3730a3, #6366f1);
        }

        .login-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.35);
            font-size: 35px;
        }

        .login-header h2 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .login-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #273253;
            margin-bottom: 8px;
        }

        .input-group-text {
            background: #f1f5f9;
            border: 1px solid #dbe2ef;
            color: #4f46e5;
        }

        .form-control {
            min-height: 48px;
            border: 1px solid #dbe2ef;
            background: #f8fafc;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.15);
        }

        .login-btn {
            min-height: 49px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #4338ca, #6366f1);
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: linear-gradient(90deg, #312e81, #4f46e5);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
        }

        .register-text {
            color: #64748b;
            font-size: 14px;
        }

        .register-text a {
            color: #4338ca;
            font-weight: 700;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background: #172554;
            color: #cbd5e1;
            text-align: center;
            padding: 22px 15px;
            margin-top: auto;
        }

        footer p {
            margin: 0 0 8px;
            font-size: 14px;
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 10px;
            font-size: 13px;
        }

        .footer-links a:hover {
            color: #a5b4fc;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            main {
                padding: 30px 15px;
            }

            .login-body {
                padding: 22px;
            }

            .navbar-brand {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="{% url 'Login' %}">
            <i class="bi bi-mortarboard-fill"></i> Student Portal
        </a>

        <button class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'Login' %}">
                        <i class="bi bi-house-door-fill"></i> Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">
                        <i class="bi bi-telephone-fill"></i> Contact
                    </a>
                </li>

                <li class="nav-item">
                    <!-- Change 'Register' if your URL name is different -->
                    <a class="nav-link register-nav"
                       href="{% url 'registration' %}">
                        <i class="bi bi-person-plus-fill"></i> Register
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>


<!-- Login Section -->
<main>
    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-person-circle"></i>
            </div>

            <h2>Welcome Back!</h2>
            <p>Login to access your student account</p>
        </div>

        <div class="login-body">

            <form method="POST" action="{% url 'Login' %}">
                {% csrf_token %}

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-fill"></i>
                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required>
                    </div>
                </div>

                <!-- Registration Number -->
                <div class="mb-3">
                    <label for="registration" class="form-label">
                        Registration Number
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-card-text"></i>
                        </span>

                        <input
                            type="text"
                            id="registration"
                            name="registration"
                            class="form-control"
                            placeholder="Enter registration number"
                            required>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            id="togglePassword"
                            aria-label="Show password">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit"
                        class="btn btn-primary login-btn w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login to Account
                </button>

            </form>

            <div class="text-center mt-4">
                <p class="register-text mb-0">
                    Don't have an account?
                    <a href="{% url 'Register' %}">Register Now</a>
                </p>
            </div>

        </div>
    </div>
</main>


<!-- Footer -->
<footer id="contact">
    <div class="container">

        <p>
            <i class="bi bi-mortarboard-fill me-1"></i>
            <strong>Student Portal</strong> &copy; 2026.
            All Rights Reserved.
        </p>

        <div class="footer-links">
            <a href="{% url 'Login' %}">
                <i class="bi bi-house"></i> Home
            </a>

            <a href="{% url 'Register' %}">
                <i class="bi bi-person-plus"></i> Register
            </a>

            <a href="mailto:support@example.com">
                <i class="bi bi-envelope"></i> Contact Support
            </a>
        </div>

    </div>
</footer>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Show / Hide Password -->
<script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', function () {
        const isPassword = password.type === 'password';

        password.type = isPassword ? 'text' : 'password';
        eyeIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';

        togglePassword.setAttribute(
            'aria-label',
            isPassword ? 'Hide password' : 'Show password'
        );
    });
</script>

</body>
</html>
